name: Release Obsidian plugin

on:
    workflow_dispatch:
        inputs:
            version:
                description: Exact manifest version
                required: true
    push:
        tags:
            - '*'

jobs:
    build:
        runs-on: ubuntu-latest
        env:
            RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        permissions:
            actions: read
            contents: write
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Use Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Verify release version
              run: |
                  manifest_version="$(node -p 'require("./manifest.json").version')"
                  test "$manifest_version" = "$RELEASE_VERSION"
                  if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
                    test "$GITHUB_REF" = refs/heads/main
                  fi

            - name: Require successful CI for this commit
              env:
                GH_TOKEN: ${{ github.token }}
              run: |
                conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/lint.yml/runs?head_sha=$GITHUB_SHA&event=push&status=completed&per_page=1" --jq ' .workflow_runs[0].conclusion')"
                test "$conclusion" = success

            - name: Build plugin
              run: |
                  npm ci
                  npm run build
                  npm run check:media

            - name: Attest build provenance
              uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
              with:
                subject-path: |
                    main.js
                    manifest.json
                    styles.css

            - name: Create release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="$RELEASE_VERSION"

                  gh release create "$tag" \
                    --title="$tag" \
                    --target="$GITHUB_SHA" \
                    --generate-notes \
                    main.js manifest.json styles.css
